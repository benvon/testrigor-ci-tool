name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    uses: benvon/reusable-workflows/.github/workflows/go-quality.yml@f70796de0a6527dbed267a64835c3cc81b8144e0
    with:
      quality_command: make ci && make security
      # Go quality tools are pinned in tools/go.mod and invoked with `go tool`.
      golangci_lint_version: ''
      gosec_version: ''
      govulncheck_version: ''
      goimports_version: ''
      staticcheck_version: ''
      coverage_file: bin/coverage/coverage.out
      upload_codecov: true
      codecov_flags: unittests
      codecov_name: codecov-umbrella
