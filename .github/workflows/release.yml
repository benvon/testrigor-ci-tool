name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to build and publish (for example v0.5.3)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate release tag
        id: validate_tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use canonical stable SemVer (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.validate_tag.outputs.release_tag }}

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Reject older release tags
        env:
          RELEASE_TAG: ${{ steps.validate_tag.outputs.release_tag }}
        run: |
          if ! stable_tags=$(git tag --list | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V); then
            echo "Could not enumerate canonical stable release tags; refusing to publish." >&2
            exit 1
          fi
          if [[ -z "$stable_tags" ]]; then
            echo "No canonical stable release tags were found; refusing to publish." >&2
            exit 1
          fi
          if ! grep -Fxq -- "$RELEASE_TAG" <<< "$stable_tags"; then
            echo "Selected release tag is missing from the fetched canonical stable tags; refusing to publish." >&2
            exit 1
          fi
          highest_tag="$(tail -n 1 <<< "$stable_tags")"
          if [[ "$RELEASE_TAG" != "$highest_tag" ]]; then
            echo "Refusing release $RELEASE_TAG: $highest_tag is already the highest stable release tag." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.validate_tag.outputs.release_tag }}
