name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to build and publish (for example v0.5.3)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate release tag
        id: validate_tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use canonical stable SemVer (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.validate_tag.outputs.release_tag }}

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Determine latest release tag
        id: release_guard
        env:
          RELEASE_TAG: ${{ steps.validate_tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! stable_tags=$(git tag --list | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V); then
            echo "Could not enumerate canonical stable release tags; refusing to publish." >&2
            exit 1
          fi
          if [[ -z "$stable_tags" ]]; then
            echo "No canonical stable release tags were found; refusing to publish." >&2
            exit 1
          fi
          if ! grep -Fxq -- "$RELEASE_TAG" <<< "$stable_tags"; then
            echo "Selected release tag is missing from the fetched canonical stable tags; refusing to publish." >&2
            exit 1
          fi
          highest_tag="$(tail -n 1 <<< "$stable_tags")"
          is_latest=false
          if [[ "$RELEASE_TAG" == "$highest_tag" ]]; then
            is_latest=true
          fi
          echo "Highest stable release tag: $highest_tag"
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"

      - name: Prepare GoReleaser config
        id: release_config
        env:
          IS_LATEST: ${{ steps.release_guard.outputs.is_latest }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tempfile
          from pathlib import Path

          if os.environ.get("IS_LATEST") not in {"true", "false"}:
              raise SystemExit("Could not determine whether this is the latest stable release; refusing to publish.")

          source_path = Path(".goreleaser.yml")
          source = source_path.read_text(encoding="utf-8")
          latest_template = '    - "ghcr.io/{{.Env.GITHUB_REPOSITORY_OWNER}}/{{.ProjectName}}:latest"\n'
          if source.count(latest_template) != 1:
              raise SystemExit("Expected exactly one known :latest Docker image template; refusing to publish.")

          versioned_config = source.replace(latest_template, "", 1)
          if ":latest" in versioned_config:
              raise SystemExit("Unexpected :latest reference remains in GoReleaser config; refusing to publish.")

          if os.environ["IS_LATEST"] == "true":
              config_path = str(source_path)
          else:
              if re.search(r"(?m)^release\s*:", source):
                  raise SystemExit("Existing release config needs explicit review before an older release.")
              older_release_config = versioned_config.rstrip() + "\n\nrelease:\n  make_latest: false\n"
              with tempfile.NamedTemporaryFile(
                  mode="w",
                  encoding="utf-8",
                  suffix=".goreleaser.yml",
                  prefix="testrigor-older-release-",
                  dir=os.environ["RUNNER_TEMP"],
                  delete=False,
              ) as config_file:
                  config_file.write(older_release_config)
                  config_path = config_file.name

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={config_path}\n")
          PY

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config ${{ steps.release_config.outputs.path }}
          workdir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.validate_tag.outputs.release_tag }}
